<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GG Checkout views</title>
    <style>
      body { margin: 0; padding: 24px; font: 13px/1.4 system-ui, sans-serif; background: #e9e9ec; color: #333; }
      h2 { font-size: 14px; font-weight: 600; margin: 28px 0 10px; }
      h2 code { font-weight: 400; color: #666; margin-left: 6px; }
      .pair { display: grid; grid-template-columns: repeat(var(--columns), minmax(0, 720px)); gap: 20px; }
      .slot { padding: 16px; border-radius: 14px; }
      .slot.light { background: #ffffff; }
      .slot.dark { background: #1f1e1d; }
      iframe { display: block; width: 100%; height: 220px; border: 0; }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
