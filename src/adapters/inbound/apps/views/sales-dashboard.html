<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de vendas</title>
<!-- include:base.css -->
<style>
  .head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
  .head h1 { margin: 4px 0 0; font-size: 22px; line-height: 1.1; }
  /* SegmentedTabs with the active tab in the CTA blue, as on the seller dashboard. */
  .ranges { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
  .ranges button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    font-size: 12px; font-weight: 600; color: var(--muted);
    transition: background-color 150ms ease, color 150ms ease;
  }
  .ranges button:hover { color: var(--ink); }
  .ranges button[aria-pressed='true'] { background: var(--season-blue); color: var(--season-white); }

  /* Metric cards (`DashboardSurface` metric variant): electric blue to its deep shade, with the flat
     diagonal shadow plane. White ink in both themes. */
  .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 640px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } .metric.lead { grid-column: 1 / -1; } }
  .metric {
    position: relative; overflow: hidden; border-radius: var(--radius); padding: 14px 16px 15px;
    color: #ffffff;
    background:
      linear-gradient(125deg, transparent 68%, rgb(0 0 0 / 0.2) 68%),
      linear-gradient(110deg, var(--season-blue), var(--season-blue-deep));
  }
  .metric.lead { grid-column: span 2; }
  .metrics-3 .metric:not(.lead) { grid-column: span 1; }
  .metric p { margin: 0; }
  .metric .m-label { font-size: 12px; font-weight: 600; opacity: 0.86; }
  .metric .m-value { margin-top: 6px; font-size: 22px; line-height: 1.1; }
  .metric .m-delta { margin-top: 8px; font-size: 12px; font-weight: 600; opacity: 0.9; }
  .metrics-3 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .chart-total { margin: 6px 0 0; font-size: 28px; line-height: 1.1; }
  .chart-sub { margin: 2px 0 0; font-size: 12px; }
  .statuses { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  @media (max-width: 560px) { .statuses { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .metrics-even { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .status { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--row-border); background: var(--row); font-size: 12px; }
  .status strong { font-size: 18px; color: var(--ink); }
  .metric.lead .m-value { font-size: 30px; }

  .surface.chart-card { margin-top: 12px; }
  .card-title { margin: 0 0 2px; font-size: 15px; }
  .chart { position: relative; margin: 8px 0 0; height: 190px; }
  .chart svg { display: block; overflow: visible; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .axis { fill: var(--faint); font-size: 11px; }
  .chart .line { fill: none; stroke: var(--chart-line); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart stop { stop-color: var(--chart-line); }
  .chart .area { fill: url(#area-fill); }
  .chart .cross { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .dot { fill: var(--chart-line); stroke: var(--page); stroke-width: 2.5; }
  .tip {
    position: absolute; top: 0; pointer-events: none; white-space: nowrap; z-index: 1;
    padding: 8px 11px; border-radius: 10px; font-size: 12px;
    background: var(--row); border: 1px solid var(--row-border);
    box-shadow: 0 10px 28px rgba(1, 1, 4, 0.18);
  }
  .tip strong { display: block; font-size: 14px; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
  .panels .surface { padding: 14px 14px 6px; }
  .panels .card-title { margin-bottom: 10px; }
  /* List rows like `.row` of the dashboard: solid, bordered, the bar inside. */
  .bar-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; margin-bottom: 8px;
    padding: 9px 11px; border-radius: 10px; border: 1px solid var(--row-border); background: var(--row); font-size: 13px;
  }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .bar-row .track { grid-column: 1 / -1; height: 5px; border-radius: 4px; background: var(--selected-bg); }
  .bar-row .fill { height: 100%; border-radius: 4px; background: var(--season-blue); min-width: 4px; }
  /* ApprovalRate: method colors as the dashboard paints them (card blue-500, pix emerald-500). */
  .method { --method: #3b82f6; --method-bg: rgba(59, 130, 246, 0.14); margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--row-border); background: var(--row); }
  .method[data-method='pix'] { --method: #10b981; --method-bg: rgba(16, 185, 129, 0.14); }
  .method[data-method='boleto'] { --method: #a3a3a3; --method-bg: rgba(163, 163, 163, 0.14); }
  .method-row { display: flex; align-items: center; gap: 12px; padding: 12px; list-style: none; cursor: pointer; }
  .method-row::-webkit-details-marker { display: none; }
  .method:not(:has(.gw-list)) .method-row { cursor: default; }
  .method-icon { flex: 0 0 auto; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px; background: var(--method-bg); }
  .method-icon img { width: 26px; height: 26px; }
  .method-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; }
  .method-text strong { font-size: 15px; font-weight: 600; }
  .method-bar { flex: 0 0 80px; height: 10px; border-radius: 999px; overflow: hidden; background: var(--selected-bg); }
  .method-bar span { display: block; height: 100%; border-radius: 999px; background: var(--method); }
  @media (max-width: 420px) { .method-bar { display: none; } }
  .method-rate { min-width: 56px; text-align: right; font-size: 15px; font-weight: 700; color: var(--method); }
  .chevron { width: 8px; height: 8px; margin: 0 2px 3px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform 200ms ease; }
  .method[open] .chevron { transform: rotate(225deg); margin-bottom: -3px; }
  .gw-list { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 12px; }
  .gw-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 52px; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--surface); font-size: 13px; }
  .gw-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; overflow: hidden; background: #ffffff; }
  .gw-mark img { width: 100%; height: 100%; object-fit: cover; }
  .gw-initial { font-size: 12px; font-weight: 800; color: #111827; }
  .gw-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .gw-rate { text-align: right; font-weight: 700; color: var(--method); }
  .empty-panel { font-size: 13px; color: var(--faint); margin: 0 0 10px; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 12px; font-size: 12px; }
  details { margin-top: 8px; font-size: 12px; }
  details summary { cursor: pointer; color: var(--selected-fg); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
  th, td { text-align: right; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  #content[aria-busy='true'] { opacity: 0.55; transition: opacity 150ms ease; }
</style>
</head>
<body>
  <div class="head">
    <div>
      <p class="eyebrow brand">GG Checkout</p>
      <h1 class="display" id="title">Vendas</h1>
    </div>
    <div class="ranges" id="ranges" role="group" aria-label="Período" hidden></div>
  </div>
  <div id="content">
    <div class="skeleton" style="height: 88px; margin-bottom: 12px"></div>
    <div class="skeleton" style="height: 230px"></div>
  </div>
<!-- include:format.js gateways.js dashboard-model.js bridge.js sales-dashboard.js -->
</body>
</html>
